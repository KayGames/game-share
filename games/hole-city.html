<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: full-bleed 3D city; HUD pinned to the top; size-up banner + modal cards centered over the stage */
:root{
  --ink:#1e1b3a;
  --paper:#fffaf0;
  --hot:#ff3d7f;
  --hot-deep:#c21d58;
  --sun:#ffd23f;
  --sky:#8fd3f4;
  --display:"Mochiy Pop One","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}

.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:3}
.row{display:flex;align-items:center;gap:8px}
.pill{font-family:var(--display);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:15px;line-height:1.2;box-shadow:0 3px 0 rgba(30,27,58,.35);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.hot{background:var(--hot);color:var(--paper);animation:throb .5s ease-in-out infinite alternate}
@keyframes throb{to{transform:scale(1.08)}}
.size{font-family:var(--display);font-size:13px;background:var(--ink);color:var(--sun);border-radius:999px;padding:5px 12px;box-shadow:0 3px 0 rgba(30,27,58,.35);letter-spacing:.06em}
.size.pop{animation:sizepop .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes sizepop{0%{transform:scale(2.2)}100%{transform:scale(1)}}
.bar{flex:1;min-width:0;position:relative;height:30px;background:rgba(30,27,58,.35);border-radius:999px;border:2px solid var(--paper);overflow:hidden;box-shadow:0 3px 0 rgba(30,27,58,.35)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(115deg,var(--hot) 0 12px,#ff6f9c 12px 22px);transition:width .2s ease-out}
.bar i.done{background:repeating-linear-gradient(115deg,#ffb800 0 12px,var(--sun) 12px 22px)}
.bar em{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--paper)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:13px;color:var(--paper);text-shadow:0 1px 0 var(--ink),0 -1px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink);font-variant-numeric:tabular-nums}
.mute{pointer-events:auto;font-family:var(--display);font-size:13px;border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:7px 10px;box-shadow:0 3px 0 rgba(30,27,58,.35);cursor:pointer}
.mute:focus-visible,.btn:focus-visible{outline:3px solid var(--hot);outline-offset:3px}

.combo{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 92px);text-align:center;font-family:var(--display);font-size:30px;color:var(--sun);pointer-events:none;z-index:3;
  text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink);opacity:0;transition:opacity .25s}
.combo small{font-size:15px;margin-left:4px}
.combo.show{opacity:1}
.combo.bump{animation:bump .18s ease-out}
@keyframes bump{from{transform:scale(1.3)}to{transform:scale(1)}}

.float{position:fixed;z-index:3;pointer-events:none;font-family:var(--display);font-size:20px;color:var(--paper);white-space:nowrap;transform:translate(-50%,-50%);
  text-shadow:0 3px 0 var(--hot-deep),2px 0 0 var(--hot),-2px 0 0 var(--hot),0 -2px 0 var(--hot);animation:rise 1.2s ease-out forwards}
.float.big{font-size:28px;color:var(--sun);text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}

.flash{position:fixed;inset:0;background:var(--paper);pointer-events:none;z-index:4;opacity:0}
.flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

.levelup{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4;overflow:hidden}
.lu{display:grid;place-items:center;position:relative;text-align:center}
.burst{position:absolute;width:150vmax;height:150vmax;left:50%;top:50%;margin:-75vmax 0 0 -75vmax;
  background:repeating-conic-gradient(rgba(255,210,63,.55) 0 7deg,rgba(255,210,63,0) 7deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0 12%,transparent 55%);mask:radial-gradient(circle,#000 0 12%,transparent 55%);
  animation:spin 3s linear infinite}
.levelup.go .burst{animation:spin 3s linear infinite,burst 1.9s ease-out forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes burst{0%{opacity:0;scale:.3}12%{opacity:1;scale:1}75%{opacity:1}100%{opacity:0;scale:1.4}}
.lu-main{position:relative;font-family:var(--display);font-size:clamp(46px,14vw,92px);line-height:1;color:var(--sun);
  text-shadow:0 6px 0 var(--hot-deep),4px 0 0 var(--hot),-4px 0 0 var(--hot),0 4px 0 var(--hot),0 -4px 0 var(--hot),0 10px 24px rgba(30,27,58,.5)}
.lu-size{position:relative;font-family:var(--display);font-size:16px;letter-spacing:.2em;background:var(--ink);color:var(--sun);border-radius:999px;padding:5px 16px;margin-bottom:10px}
.lu-sub{position:relative;margin-top:14px;font-family:var(--display);font-size:clamp(18px,5.4vw,28px);color:var(--paper);background:var(--hot);border-radius:14px;padding:6px 16px;box-shadow:0 4px 0 var(--hot-deep)}
.lu-time{position:relative;margin-top:10px;font-family:var(--display);font-size:clamp(24px,7vw,36px);color:#3ee07a;
  text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink)}
.levelup.go .lu-time{animation:pop 1.9s .2s ease-out both}
.pill.bonus{background:#3ee07a;color:var(--ink);animation:sizepop .6s cubic-bezier(.2,1.8,.4,1)}
.levelup.go .lu-size{animation:pop 1.9s ease-out forwards}
.levelup.go .lu-main{animation:slam 1.9s cubic-bezier(.2,1.6,.4,1) forwards}
.levelup.go .lu-sub{animation:pop 1.9s .08s ease-out both}
@keyframes slam{0%{opacity:0;transform:scale(3.2) rotate(-14deg)}14%{opacity:1;transform:scale(1) rotate(-5deg)}20%{transform:scale(1.12) rotate(-5deg)}26%{transform:scale(1) rotate(-5deg)}80%{opacity:1;transform:scale(1) rotate(-5deg)}100%{opacity:0;transform:scale(1.5) rotate(-5deg)}}
@keyframes pop{0%{opacity:0;transform:translateY(20px) scale(.6)}16%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

.joy{position:fixed;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:2px solid rgba(255,250,240,.8);background:rgba(30,27,58,.15);pointer-events:none;z-index:3}
.joy b{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(255,250,240,.9)}

.screen{position:fixed;inset:0;display:grid;place-items:center;background:rgba(30,27,58,.45);z-index:5;padding-inline:16px}
.card{width:100%;max-width:340px;background:var(--paper);color:var(--ink);border-radius:24px;padding:26px 22px 22px;text-align:center;box-shadow:0 8px 0 rgba(30,27,58,.4);display:flex;flex-direction:column;gap:14px;align-items:center}
.card h1{margin:0;font-family:var(--display);font-weight:400;font-size:48px;line-height:1.05;color:var(--hot);text-shadow:0 4px 0 var(--ink);text-wrap:balance}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:38px;line-height:1.1;color:var(--hot);text-shadow:0 3px 0 var(--ink)}
.card p{margin:0;font-size:15px;line-height:1.6;font-weight:500;text-wrap:balance}
.lv{font-family:var(--display);font-size:14px;letter-spacing:.08em;background:var(--ink);color:var(--sun);border-radius:999px;padding:4px 14px}
.goal{font-family:var(--display);font-size:14px;color:var(--hot-deep)}
.stars{font-size:38px;letter-spacing:6px;line-height:1;color:#ddd5c4}
.stars .on{color:#ffb800;text-shadow:0 3px 0 var(--hot-deep)}
.stats{display:flex;gap:10px;width:100%}
.stats div{flex:1;background:#f1e8d6;border-radius:14px;padding:8px 4px;font-size:12px;font-weight:800}
.stats strong{display:block;font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.btn{font-family:var(--display);font-size:20px;border:0;background:var(--hot);color:var(--paper);border-radius:999px;padding:14px 34px;box-shadow:0 5px 0 var(--hot-deep);cursor:pointer;width:100%;max-width:240px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--hot-deep)}
.hint{font-size:12px;opacity:.7}
@media (prefers-reduced-motion:reduce){.pill.hot,.combo.bump,.burst,.size.pop{animation:none!important}.flash{display:none}}
</style>

<div id="stage"></div>

<div class="hud" id="hud" hidden>
  <div class="row">
    <div class="pill" id="hudLv">Lv.1</div>

<div class="combo" id="combo">×0<small>コンボ</small></div>

<div class="screen" id="resultScreen" hidden>
  <div class="card">
    <span class="lv" id="resLv">Lv.1</span>

      <div>最大サイズ<strong id="resSize">1</strong></div>
    </div>
    <button class="btn" id="resBtn" type="button">次の街へ</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const B = 20, R0 = 0.55, FIT = 0.92;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pickArr = a => a[Math.floor(Math.random() * a.length)];
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= renderer ================= */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const SKY = 0x8fd3f4;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 60, 160);
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 500);
scene.add(new THREE.HemisphereLight(0xe4f3ff, 0xb3a487, 0.78));
const sun = new THREE.DirectionalLight(0xfff3dd, 0.62);
sun.position.set(-6, 12, 7);
scene.add(sun);
function resize() {

  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

/* ================= textures ================= */
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const PPU = 512 / B;
const groundTex = canvasTex(512, 512, (g, W) => {
  const u = v => v * PPU, c = W / 2;
  g.fillStyle = '#e4dccb'; g.fillRect(0, 0, W, W);
  g.strokeStyle = 'rgba(150,138,115,.28)'; g.lineWidth = 1;
  for (let x = 0; x <= W; x += u(2)) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, W); g.stroke(); g.beginPath(); g.moveTo(0, x); g.lineTo(W, x); g.stroke(); }
  g.fillStyle = '#cbc3b4'; g.fillRect(c - u(3.2), 0, u(6.4), W); g.fillRect(0, c - u(3.2), W, u(6.4));
  g.strokeStyle = 'rgba(120,110,95,.3)';
  for (let y = 0; y < W; y += u(.8)) { g.beginPath(); g.moveTo(c - u(3.2), y); g.lineTo(c + u(3.2), y); g.stroke(); g.beginPath(); g.moveTo(y, c - u(3.2)); g.lineTo(y, c + u(3.2)); g.stroke(); }
  g.fillStyle = '#9d9585'; g.fillRect(c - u(2.15), 0, u(4.3), W); g.fillRect(0, c - u(2.15), W, u(4.3));
  g.fillStyle = '#4a4e5b'; g.fillRect(c - u(2), 0, u(4), W); g.fillRect(0, c - u(2), W, u(4));
  for (let i = 0; i < 900; i++) {
    const a = Math.random() < .5, p = Math.random() * W, q = c + rand(-u(2), u(2));
    g.fillStyle = Math.random() < .5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.08)';
    a ? g.fillRect(q, p, 2, 2) : g.fillRect(p, q, 2, 2);
  }
  g.fillStyle = '#f2c230';
  for (let y = 0; y < W; y += u(2.4)) {
    if (Math.abs(y + u(.6) - c) < u(4.2)) continue;
    g.fillRect(c - u(.07), y, u(.14), u(1.2)); g.fillRect(y, c - u(.07), u(1.2), u(.14));

    const off = k * u(.55);
    [c + u(2.4), c - u(3.8)].forEach(a => {
      g.fillRect(c + off - u(.18), a, u(.36), u(1.4));
      g.fillRect(a, c + off - u(.18), u(1.4), u(.36));

  }
}, true);
const grassTex = canvasTex(128, 128, g => {
  g.fillStyle = '#8fd06c'; g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 500; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(60,130,50,.25)' : 'rgba(200,240,150,.25)'; g.fillRect(Math.random() * 128, Math.random() * 128, 2, 3); }
}, true);
function facade(wu, hu, o) {
  const ppu = 22, W = Math.min(512, Math.round(wu * ppu)), H = Math.min(1024, Math.round(hu * ppu));
  return canvasTex(W, H, g => {
    g.fillStyle = o.wall; g.fillRect(0, 0, W, H);
    const top = H * (o.top || .06), bot = H * (o.bottom || .06), mx = W * .07;
    const cw = (W - 2 * mx) / o.cols, rh = (H - top - bot) / o.rows;
    for (let r = 0; r < o.rows; r++) for (let c = 0; c < o.cols; c++) {
      const x = mx + c * cw + cw * (o.gx || .14), y = top + r * rh + rh * (o.gy || .18), w = cw * (1 - 2 * (o.gx || .14)), h = rh * (1 - 2 * (o.gy || .18));

      g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(x, y, w * .3, h);
      if (o.rail) { g.fillStyle = o.rail; g.fillRect(x - cw * .1, y + h * .62, w + cw * .2, h * .38); }
    }
    if (o.extra) o.extra(g, W, H);
  });
}
const T_house1 = facade(3, 2.2, { wall: '#f6ead2', win: '#6aa9d8', cols: 2, rows: 1, top: .25, bottom: .3, gx: .2,
  extra: (g, W, H) => { g.fillStyle = '#8a5a3c'; g.fillRect(W * .42, H * .45, W * .16, H * .55); } });
const T_house2 = facade(3, 2.2, { wall: '#dbe9f2', win: '#4c7fb3', cols: 2, rows: 1, top: .25, bottom: .3, gx: .2,
  extra: (g, W, H) => { g.fillStyle = '#5d4a3a'; g.fillRect(W * .42, H * .45, W * .16, H * .55); } });
const T_shop = facade(5, 2.6, { wall: '#ffffff', win: '#bfe3f2', cols: 3, rows: 1, top: .38, bottom: .02, gx: .04, gy: .05,
  extra: (g, W, H) => {
    g.fillStyle = '#1aa05a'; g.fillRect(0, H * .06, W, H * .1);
    g.fillStyle = '#f39a1e'; g.fillRect(0, H * .16, W, H * .06);

  } });
const T_apart = facade(5, 9, { wall: '#efe0c4', win: '#557fa5', cols: 3, rows: 6, rail: '#fbf6ec', top: .05, bottom: .1 });
const T_office = facade(6, 14, { wall: '#7d90a6', win: '#a9d4ef', cols: 6, rows: 12, gx: .08, gy: .1, lit: .05 });
const T_sky = facade(7, 22, { wall: '#2b3556', win: '#3e5a8e', cols: 7, rows: 20, gx: .1, gy: .14, lit: .3, top: .03, bottom: .03 });
const T_roof = canvasTex(64, 64, g => {
  g.fillStyle = '#9aa0a6'; g.fillRect(0, 0, 64, 64);
  g.strokeStyle = '#7d8389'; g.lineWidth = 4; g.strokeRect(2, 2, 60, 60);

const T_tower = canvasTex(64, 256, g => {
  for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#ffffff' : '#e8442e'; g.fillRect(0, i * 32, 64, 32); }

});
const T_bus = canvasTex(256, 96, g => {
  g.fillStyle = '#f4ecd6'; g.fillRect(0, 0, 256, 96);
  g.fillStyle = '#1f9a6a'; g.fillRect(0, 56, 256, 40);

const T_truck = canvasTex(128, 64, g => {

  g.fillStyle = '#2b62c2'; g.font = 'bold 18px sans-serif'; g.fillText('HOLE便', 30, 26);
});
const T_vend = canvasTex(64, 128, g => {
  g.fillStyle = '#d7263d'; g.fillRect(0, 0, 64, 128);

    let mx = 0, mz = 0;
    if (joy) { const dx = joy.x - joy.x0, dy = joy.y - joy.y0, d = Math.hypot(dx, dy); if (d > 4) { const c = Math.min(1, d / 48) / d; mx = dx * c; mz = dy * c; } }
    if (keys.arrowleft || keys.a) mx -= 1; if (keys.arrowright || keys.d) mx += 1;
    if (keys.arrowup || keys.w) mz -= 1; if (keys.arrowdown || keys.s) mz += 1;
    const ml = Math.hypot(mx, mz); if (ml > 1) { mx /= ml; mz /= ml; }
    const sp = 5.5 + R * 1.3, lim = HALF - R * .3;
    hx = Math.max(-lim, Math.min(lim, hx + mx * sp * dt));
    hz = Math.max(-lim, Math.min(lim, hz + mz * sp * dt));
    if (clock - lastEat > .9 && combo) { combo = 0; comboEl.classList.remove('show'); }
  }
  R += (targetR - R) * Math.min(1, dt * 5);
  depth = 1.6 + R * 2.4;
  power = Math.max(0, power - rdt);
  const pulse = power > 0 ? 1 + Math.sin(clock * 22) * .05 * Math.min(1, power) : 1;
  hole.position.set(hx, 0, hz); hole.scale.set(R * pulse, 1, R * pulse);
  pit.position.set(hx, 0, hz); pit.scale.set(R, depth, R);
  if (power > 0) rimOut.material.color.setHSL((clock * 1.6) % 1, 1, .6); else rimOut.material.color.set(0xff3d7f);

  // traffic & pedestrians
  if (playing) {
    for (const it of movers) {
      if (it.state !== 0) continue;
      const m = it.mv, d = m.dir * m.sp * dt;
      if (m.axis === 'x') { it.x += d; if (it.x > HALF) it.x -= 2 * HALF; else if (it.x < -HALF) it.x += 2 * HALF; }
      else { it.z += d; if (it.z > HALF) it.z -= 2 * HALF; else if (it.z < -HALF) it.z += 2 * HALF; }
      if (m.walk) it.y = Math.abs(Math.sin(clock * 9 + it.ph)) * .07;
      writeItem(it); writeShadow(it);
    }
    if (movers.length) shadowMesh.instanceMatrix.needsUpdate = true;
  }

  if (playing) {
    const fitR = R * FIT, R2 = R * R;
    let shadowDirty = false;
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (it.state === 0) {
        const dx = it.x - hx, dz = it.z - hz;
        if (Math.abs(dx) > R + it.r + .5 || Math.abs(dz) > R + it.r + .5) { if (it.jig) { it.jig = false; it.tilt = 0; writeItem(it); } continue; }
        const d2 = dx * dx + dz * dz;
        if (it.r <= fitR && d2 < R2) {
          it.state = 1; it.ox = dx; it.oz = dz; it.vy = 0; it.tilt = 0; it.y = Math.max(0, it.y);
          const l = Math.sqrt(d2) || 1; it.ax = dz / l || 1; it.az = -dx / l || 0;
          it.spin = rand(-2.5, 2.5) / (1 + it.h * .2);
          it.maxTilt = Math.min(1.4, 1.8 * R / (it.h + R));
          writeShadow(it); shadowDirty = true;
        } else if (it.r > fitR && d2 < (R + it.r * .5) ** 2) {
          const l = Math.sqrt(d2) || 1; it.ax = dz / l; it.az = -dx / l;
          it.tilt = Math.sin(clock * 34 + it.gi) * (.04 + .02 / (1 + it.h * .1)); it.jig = true; writeItem(it);
        } else if (it.jig) { it.jig = false; it.tilt = 0; writeItem(it); }
      }
      if (it.state === 1) {
        it.vy -= 30 * dt; it.y += it.vy * dt;
        const maxOff = Math.max(0, R - it.r * .75), len = Math.hypot(it.ox, it.oz);
        if (len > 1e-4) {
          const target = Math.min(len, maxOff) * Math.exp(-dt * 1.5);
          const nl = len + (target - len) * Math.min(1, dt * 14);
          it.ox *= nl / len; it.oz *= nl / len;
        }
        it.x = hx + it.ox; it.z = hz + it.oz;
        it.tilt = Math.min(it.maxTilt, it.tilt + dt * 3.5);
        it.yaw += it.spin * dt;
        if (it.y < -(it.h + depth * .6)) eatItem(it); else writeItem(it);
        if (!playing) break;
      }
    }
    if (shadowDirty) shadowMesh.instanceMatrix.needsUpdate = true;
    // ambient vortex while swallowing in a row
    if (clock - lastEat < .5) {
      const rate = Math.min(70, 10 + combo * 4);
      if (Math.random() < rate * dt) eatFx({ r: 0 });
    }
    if (playing && timeLeft <= 0) endLevel();
    updateHUD();
  }
  flushDirty();

  confetti.update(dt); glow.update(dt); debris.update(dt);
  rings.forEach(r => {
    if (!r.on) return;
    r.t += dt;
    if (r.t < 0) { r.m.visible = false; return; }
    const k = r.t / r.dur;
    if (k >= 1) { r.on = false; r.m.visible = false; return; }
    const e = 1 - Math.pow(1 - k, 3), sc = r.from + (r.to - r.from) * e;
    r.m.visible = true; r.m.position.set(hx, .12, hz); r.m.scale.set(sc, 1, sc); r.m.material.opacity = 1 - k;
  });
  if (pillarT > 0) {
    pillarT -= dt; pillar.visible = true;
    pillar.position.set(hx, 0, hz); pillar.scale.set(R * 1.02, 30 + R * 6, R * 1.02);
    pillar.material.opacity = Math.min(1, pillarT) * .42; pillar.material.color.setHSL((clock * 1.6) % 1, 1, .65);
  } else pillar.visible = false;

  // camera
  camH += (hFor(R) - camH) * Math.min(1, dt * 2.5);
  camX += (hx - camX) * Math.min(1, dt * 6);
  camZ += (hz - camZ) * Math.min(1, dt * 6);
  shake *= Math.exp(-rdt * 5);
  const sx = (Math.random() - .5) * shake, sz = (Math.random() - .5) * shake;
  idleOx += ((startEl.hidden ? 0 : Math.sin(clock * .15) * 6) - idleOx) * Math.min(1, rdt * 2);
  const ox = idleOx;
  scene.fog.near = camH * 2.4; scene.fog.far = camH * 6;
  camera.position.set(camX + sx + ox, camH, camZ + camH * .58 + sz);
  camera.lookAt(camX + sx * .5 + ox, 0, camZ - camH * .04);
}

/* ================= boot ================= */
buildLevel(level);
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
