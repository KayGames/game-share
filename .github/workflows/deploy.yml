name: ゲーム一覧を更新して公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 作者・追加日を git 履歴から取るため

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: games.json を生成
        run: node scripts/build-index.mjs

      - name: 公開用ファイルをまとめる
        run: |
          mkdir _site
          cp index.html games.json _site/
          cp -r games _site/
          touch _site/.nojekyll

      - name: 検索エンジンに載らないようにする
        run: node scripts/add-noindex.mjs _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
